<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Update — FineTune</title>
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <header class="side__brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M22 28.87A14.2 14.2 0 1 1 28.87 22" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.8 20.8V11.2h5.76M8.8 16h4.48M16.4 11.2h6.8M19.76 11.2v9.6" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M26.04 22.4 29.68 26.04 26.04 29.68 22.4 26.04Z" fill="#78D98A"/></svg>
      <div><b>Portfolio Update</b><small>FineTune · v4 especialista</small></div>
    </header>
    <p class="side__status" id="conn"><i></i><span>Conectando…</span></p>
    <nav class="side__nav" aria-label="Conteúdo">
      <p class="side__h"><span>Site</span></p>
      <ul class="pages" id="pages"></ul>
      <p class="side__h"><span>Jobs</span><button type="button" class="mini" id="addJob">+ Novo job</button></p>
      <ol class="jobs" id="jobs"></ol>
    </nav>
    <footer class="side__foot">
      <a href="/v4/index.html" target="_blank" rel="noopener">Abrir site local (v4) ↗</a>
      <a href="https://ggcrafts.github.io/FINETUNE/v4/" target="_blank" rel="noopener">Site online (v4) ↗</a>
    </footer>
  </aside>

  <main class="main">
    <header class="bar">
      <div class="bar__title"><small id="crumb">—</small><b id="barTitle">—</b></div>
      <div class="seg" id="langSeg" role="group" aria-label="Idioma dos textos">
        <button type="button" data-l="en" class="on">EN</button><button type="button" data-l="pt">PT</button>
      </div>
      <span class="bar__state" id="saveState">—</span>
      <button type="button" class="btn" id="saveBtn" title="Ctrl + S">Salvar</button>
      <button type="button" class="btn btn--ghost" id="pubBtn" title="Salva e abre o publish.bat">Publicar online</button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="form" id="form"></div>
  </main>

  <section class="pv" id="pv" aria-label="Pré-visualização">
    <header class="pv__bar">
      <div class="seg" id="devSeg" role="group" aria-label="Tamanho">
        <button type="button" data-d="desktop" class="on">Desktop</button><button type="button" data-d="mobile">Mobile</button>
      </div>
      <label class="chk"><input type="checkbox" id="autoPv" checked> Auto</label>
      <button type="button" class="mini" id="pvReload">Atualizar</button>
      <a class="mini" id="pvOpen" href="#" target="_blank" rel="noopener">Nova aba ↗</a>
      <button type="button" class="mini pv__hide" id="pvToggle" title="Mostrar / esconder preview">⟩</button>
    </header>
    <div class="pv__stage" id="pvStage"><iframe id="pvFrame" title="Pré-visualização do site"></iframe></div>
    <p class="pv__note">Preview com as alterações ainda não salvas.</p>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="./editor.js"></script>
</body>
</html>
